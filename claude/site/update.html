<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>به‌روزرسانی بیوتی‌ولت</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(160deg,#eef5ff,#f6efff 55%,#fff0f6);color:#2b3550}
.box{background:#fff;border-radius:22px;padding:26px 22px;max-width:360px;margin:16px;text-align:center;box-shadow:0 12px 34px rgba(90,90,160,.16);line-height:2}
b{font-size:18px}
small{color:#68708a}
a{display:inline-block;margin-top:10px;padding:10px 18px;border-radius:14px;background:linear-gradient(135deg,#7aa7ff,#c08cff 60%,#ff9cc7);color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="box"><b>در حال به‌روزرسانی… 💎</b><p id="t">نسخه‌ی تازه‌ی بیوتی‌ولت آماده می‌شود. پروفایل، روتین و عکس‌هایت سر جایشان می‌مانند.</p><a id="go" href="/legacy/">ورود به بیوتی‌ولت</a><br><small>اگر اپ را روی صفحه‌ی اصلی گوشی نصب کرده‌ای، بعد از این یک بار اپ را ببند و دوباره باز کن.</small></div>
<script>
// Only the app's cached files are refreshed; nothing the shopper saved (localStorage, photos in IndexedDB) is touched.
(async function(){var v=Date.now().toString(36);
  try{if('serviceWorker' in navigator){var regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(r){return r.update().catch(function(){})}))}}catch(e){}
  try{if(window.caches){var keys=await caches.keys();await Promise.all(keys.filter(function(k){return /^bw-/.test(k)}).map(function(k){return caches.delete(k)}))}}catch(e){}
  document.getElementById('t').textContent='به‌روز شد ✓ پروفایل، روتین و عکس‌هایت سر جایشان هستند.';
  var go=document.getElementById('go');go.href='/legacy/?u='+v;setTimeout(function(){location.replace(go.href)},1200)})();
</script>
</body>
</html>
