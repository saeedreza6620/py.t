:root{--navy:#06182a;--navy2:#0b2238;--navy3:#113250;--gold:#d7ae55;--gold2:#f2d48e;--cream:#fffaf0;--ink:#102338;--muted:#637083;--line:#e7e3da;--green:#168263;--red:#bd4b50;--amber:#a67012;--shadow:0 18px 55px rgba(5,22,39,.12);font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:#f7f8f9;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#fff6df 0,transparent 30%),#f7f8f9}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.app-shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;height:76px;padding:0 max(22px,calc((100vw - 1280px)/2));display:flex;align-items:center;justify-content:space-between;background:rgba(6,24,42,.96);backdrop-filter:blur(15px);color:white;border-bottom:1px solid rgba(215,174,85,.26)}
.brand{display:flex;gap:12px;align-items:center;background:none;border:0;color:white;text-align:right}.brand-mark{width:42px;height:42px;border:1px solid var(--gold);border-radius:15px;display:grid;place-items:center;color:var(--gold2);font-weight:800;box-shadow:inset 0 0 20px rgba(215,174,85,.08)}.brand b{display:block;font-size:18px;line-height:1.1}.brand small{display:block;font-size:11px;color:#afbdd0;font-weight:400;margin-top:4px}.profile-chip{border:1px solid rgba(255,255,255,.15);background:#102e49;color:white;border-radius:999px;padding:9px 13px;display:flex;align-items:center;gap:9px}.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--navy);font-weight:800}
.desktop-nav{display:flex;gap:4px}.desktop-nav button{border:0;background:transparent;color:#adbbca;padding:11px 13px;border-radius:12px}.desktop-nav button:hover,.desktop-nav button.active{color:white;background:rgba(255,255,255,.08)}.desktop-nav button.active{box-shadow:inset 0 -2px var(--gold)}
.page{max-width:1180px;margin:0 auto;padding:34px 22px 110px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.page-head h1{font-size:clamp(25px,3vw,40px);margin:0}.page-head p{margin:5px 0 0;color:var(--muted)}.eyebrow{display:inline-flex;align-items:center;gap:7px;color:#9a6c15;font-size:13px;font-weight:700}.eyebrow:before{content:'';width:16px;height:1px;background:var(--gold)}

function confidence(p){if(p.importSource)return 10;let n=p.pilotEligible?68:p.gate==='B'?46:32;if(p.gtinCandidate)n+=8;if(p.sourceUrl)n+=6;if(p.price)n+=5;return Math.min(91,n)}
function productById(id){return DATA.catalog.find(p=>(p.productId||String(p.priority))===id)}
function userGaps(){const p=state.profile,g=[];if(!p.skinBase||!p.skinToday)g.push('وضعیت پوست');if(!p.goal1||!p.dealbreaker)g.push('هدف و خط قرمز');if(!p.routine?.length)g.push('روتین فعلی');if(!p.productBudget)g.push('سقف قیمت محصول');if(!Array.isArray(p.safetyFlags))g.push('وضعیت ایمنی');return g}
function productGaps(p){const g=[];if(p.importSource)g.push('مدل، حجم و نسخه بازار');if(!p.productId)g.push('شناسه دقیق محصول');if(!p.gtinCandidate)g.push('بارکد تطبیق‌شده');if(!p.pilotEligible)g.push('پاسپورت فیزیکی');if(!p.formulaVerified)g.push('فرمول و ترکیبات کامل همان نسخه');if(!price(p))g.push('قیمت تاریخ‌دار');return g}
function decision(p,ctx={}){const reasons=[],risks=[],pfs=state.profile,ug=userGaps(),pg=productGaps(p);let verdict='wait',title='صبر کن';const duplicate=ownedCategory(p.category);const redFlag=pfs.skinToday?.includes('تحریک')||pfs.skinToday?.includes('قرمز')||pfs.barrier==='احتمالاً آسیب‌دیده'||pfs.safetyFlags?.length;const negativeHistory=(pfs.history||[]).some(h=>['جوش','سوزش/قرمزی','توقف'].includes(h.experience));const complete=!ug.length;
 if(duplicate){verdict='wait';title='اول با محصول فعلی مقایسه کن';reasons.push(`در کیفت یک ${p.category} فعال داری؛ این فقط نشانهٔ خرید تکراری احتمالی است، نه حکم قطعی برای نخریدن.`);reasons.push('کاربرد دقیق، میزان باقی‌مانده و رضایتت از محصول فعلی باید مقایسه شود.')}
 else if(redFlag&&['سرم و اکتیو','ضدلک','ضدچروک','ضدجوش'].includes(p.category)){verdict='no';title='فعلاً نخر';risks.push('وضعیت فعلی پوست یا علامت ایمنی با شروع اکتیو جدید سازگار نیست.')}
 else if(!complete){reasons.push(`کمبود اطلاعات کاربر: ${ug.join('، ')}.`)}
 else if(!p.pilotEligible){reasons.push('هویت یا نسخهٔ دقیق این محصول هنوز در دیتاست حل نشده است.')}
 else if(!ctx.packageConfirmed){reasons.push('بستهٔ فیزیکی با پاسپورت داده تطبیق داده نشده است.')}
 else if(!p.formulaVerified){reasons.push('بسته انتخاب شده، اما فرمول کامل همین نسخه هنوز تأیید نشده است.');title='صبر کن؛ فرمول حل نشده'}
 else {verdict='buy';title='بخر؛ با شروع کنترل‌شده';reasons.push('در روتینت محصول هم‌نقش فعالی ثبت نشده است.');reasons.push(`هدف اصلی ثبت‌شده: ${pfs.goal1}.`);reasons.push('تو تطابق بسته با گزینهٔ دیتاست را تأیید کردی.')}
 if(negativeHistory&&['سرم و اکتیو','ضدلک','ضدچروک','ضدجوش'].includes(p.category))risks.push('سابقه واکنش نامطلوب ثبت شده؛ شباهت دسته محصول به‌تنهایی علت را ثابت نمی‌کند، اما شروع باید محافظه‌کارانه باشد.');
 if(price(p)&&!freshPrice(p)){reasons.push('قیمت ثبت‌شده قدیمی است؛ برای بررسی بودجه، قیمت امروز را وارد کن.');if(verdict==='buy'){verdict='wait';title='قیمت امروز لازم است'}}
 else if(price(p)){const monthlyFits=price(p)<=remaining(),productFits=price(p)<=Number(pfs.productBudget??Infinity);reasons.push(monthlyFits&&productFits?'قیمت ثبت‌شده هم در بودجه ماهانه و هم سقف هر محصول جا می‌شود.':'قیمت ثبت‌شده از یکی از سقف‌های بودجه تو بیشتر است.');if((!monthlyFits||!productFits)&&verdict==='buy'){verdict='wait';title='صبر کن؛ خارج از بودجه'}} else reasons.push('قیمت قابل اتکا ثبت نشده؛ صفر فرض نمی‌شود.');
 if(['remote_metadata_mapped_physical_pending','claims_only_physical_pending','candidate_gtin_physical_pending'].includes(p.verificationStatus))risks.push('فرمول کامل و همان بسته هنوز تأیید فیزیکی نشده است.');
 if(pg.length)risks.push(`کمبود داده محصول: ${pg.join('، ')}.`);return {verdict,title,reasons,risks,confidence:Math.min(98,confidence(p)+(ctx.packageConfirmed?7:0))} }

function assistantPrompts(){const sets={decision:['این محصول ارزش خرید دارد؟','بین دو محصول چطور انتخاب کنم؟','آیا خرید تکراری دارم؟','چرا گفتی صبر کنم؟'],routine:['روتینم را در سه قدم بچین','کدام مرحله روتینم خالی است؟','چه چیزهایی را هم‌زمان تغییر ندهم؟','روتینم را برای صبح شلوغ کوتاه کن'],progress:['از نتیجه‌هایم چه یاد گرفتی؟','امروز چه چیزی را ثبت کنم؟','آیا وقت قضاوت نتیجه رسیده؟','یک آزمایش یک‌تغییر شروع کنیم'],budget:['این ماه چقدر برای پوستم خرج کردم؟','کدام خرید را فعلاً عقب بیندازم؟','جایگزین اقتصادی لازم دارم','چقدر پول با تصمیم‌هایم حفظ شده؟']};return sets[state.assistantMode]||sets.decision}
function assistantBrief(){const n=nextAction();return {title:n.title,text:n.text,action:n.action,route:n.route}}
function assistant(){const insights=assistantInsights(),brief=assistantBrief(),modes=[['decision','تصمیم خرید'],['routine','روتین'],['progress','نتیجه و پیگیری'],['budget','بودجه']];return shell(`<div class="page-head"><div><span class="eyebrow">حافظه‌محور، شفاف و اقدام‌محور</span><h1>همراه هوشمند BeautyWallet</h1><p>یک مسئله را تا یک تصمیم قابل انجام جلو می‌برد؛ جواب عمومی و فهرست بلند تحویلت نمی‌دهد.</p></div><span class="memory-badge">✦ ${fa(memorySignals())} نشانه از تو می‌دانم</span></div><div class="assistant-modes">${modes.map(x=>`<button class="chip ${state.assistantMode===x[0]?'active':''}" data-assistant-mode="${x[0]}">${x[1]}</button>`).join('')}</div><div class="chat-layout"><section class="card chat-panel"><div class="assistant-brief"><small>پیشنهاد هوشمند همین حالا</small><b>${esc(brief.title)}</b><div class="small">${esc(brief.text)}</div><button class="gold" data-route="${brief.route}">${esc(brief.action)}</button></div><header class="chat-head"><span class="ai-orb">✦</span><div><b>همراه تصمیم‌ساز تو</b><div class="small"><span class="online-dot"></span> پاسخ بر اساس کیف، بودجه و سابقه تو</div></div></header><div class="chat-body" id="chatBody">${state.chat.length?state.chat.map(m=>`<div class="bubble ${m.role==='user'?'user':'ai'}">${esc(m.text)}</div>`).join(''):`<div class="bubble ai">سلام${state.profile.name?' '+esc(state.profile.name):''}.\nبه‌جای اینکه از اول همه‌چیز را بپرسم، فقط سؤال لازم برای تصمیم امروزت را می‌پرسم:\nاسم، لینک یا بارکد محصولی که الان بین خریدن و نخریدنش مرددی چیست؟</div>`}</div><div class="smart-prompts">${assistantPrompts().map(x=>`<button class="chip" data-ask="${x}">${x}</button>`).join('')}</div><form id="chatForm" class="chat-form"><textarea name="message" rows="2" placeholder="محصول یا مسئله‌ات را همان‌طور که به یک دوست می‌گویی بنویس…" required></textarea><button class="gold">بررسی</button></form></section><aside class="side-stack"><section class="card"><div class="eyebrow">چیزی که در تصمیم لحاظ می‌شود</div>${insights.map(x=>`<div class="insight"><b>${esc(x.title)}</b><span class="small">${esc(x.text)}</span></div>`).join('')}</section><section class="card"><div class="eyebrow">مرز اعتماد</div><p class="small">منبع و کمبود داده را نشان می‌دهم، درصد پوشش داده را با احتمال نتیجه اشتباه نمی‌گیرم و برای علائم شدید یا درمان فعال تصمیم پزشکی نمی‌سازم.</p></section></aside></div>`)}
function assistantInsights(){const p=state.profile,lp=latestPulse();return [{title:'وضعیت امروز',text:lp?`${lp.mood} · ${lp.factor}`:`${p.skinToday} · هنوز ثبت کوتاه امروز انجام نشده`},{title:'هدف و خط قرمز',text:`${p.goal1} · پرهیز از ${p.dealbreaker}`},{title:'کیف و روتین',text:(p.routine.length||state.wallet.length)?`${fa(Math.max(p.routine.length,state.wallet.length))} محصول ثبت شده؛ ${nextNeed()}`:'هنوز چیزی در کیف ثبت نشده؛ برای تشخیص خرید تکراری لازم است.'},{title:'بودجه تصمیم',text:`${fa(remaining())} تومان باقی‌مانده؛ ${fa(protectedMoney())} تومان خرید متوقف یا معلق.`},{title:'یادگیری از نتیجه',text:state.followups.length?`${fa(state.followups.length)} نتیجه در تصمیم‌های بعدی اثر می‌گذارد.`:'هنوز نتیجه‌ای ثبت نشده؛ اولین پیگیری حافظه واقعی تو را می‌سازد.'}]}
function recommendations(limit=3){const goal=state.profile.goal1;const categoryBoost=p=>goal.includes('آفتاب')&&p.category==='ضدآفتاب'?6:goal.includes('آبرسان')&&p.category==='مرطوب‌کننده'?6:(goal.includes('جوش')||goal.includes('چربی'))&&p.category==='سرم و اکتیو'?4:0;return DATA.catalog.map(p=>({p,d:decision(p,{packageConfirmed:false}),score:confidence(p)+categoryBoost(p)-(ownedCategory(p.category)?100:0)-(price(p)>Number(state.profile.productBudget||Infinity)?20:0)})).filter(x=>!ownedCategory(x.p.category)&&x.p.pilotEligible).sort((a,b)=>b.score-a.score||a.p.priority-b.p.priority).slice(0,limit)}
function matchedProduct(n){const scored=DATA.catalog.map(p=>{const tokens=norm(p.name).split(' ').filter(w=>w.length>1&&!['سرم','کرم','پوست','مدل','حجم','ضد','ژل','شستشو','شست','وشو','برای'].includes(w));const hit=tokens.filter(t=>n.includes(t)).length;return {p,score:hit/Math.max(tokens.length,1),hit}}).filter(x=>x.hit>=2&&x.score>=0.55).sort((a,b)=>b.score-a.score);return scored.length&&(!scored[1]||scored[0].score-scored[1].score>0.15)?scored[0].p:null}

function answer(q){const n=norm(q),p=state.profile,who=p.name?`${p.name}، `:'';if(/تاول|تورم|مشکل تنفس|زخم|درد شدید/.test(n))return `⛔ توقف ایمن\n${who}این مورد دیگر مسئله انتخاب محصول نیست. اگر علامت شدید یا رو به بدترشدن است، ارزیابی فوری پزشکی لازم است.\n\nقدم بعدی: محصول تازه را فعلاً کنار بگذار و برای ارزیابی حرفه‌ای اقدام کن.`;if(p.safetyFlags?.length||/حامله|باردار|شیرده|دارو|درمان پزشکی/.test(n))return `جمع‌بندی: بدون بررسی حرفه‌ای، پیشنهاد خرید نمی‌دهم.\nچرا: ${p.safetyFlags?.join('، ')||'شرایط درمانی یا بارداری/شیردهی مطرح شده'} می‌تواند مرز تصمیم خرید معمولی را تغییر دهد.\nقدم بعدی: نام دقیق محصول و درمان فعلی را برای پزشک یا داروساز آماده کن.`;const hit=matchedProduct(n);if(hit){const d=decision(hit,{packageConfirmed:false});return `${hit.name}\nجمع‌بندی: ${d.title}\n\nچرا برای تو:\n• ${d.reasons.slice(0,3).join('\n• ')}\n\nآنچه هنوز نمی‌دانم:\n${d.risks[0]||'برای دقیق‌ترشدن، تطابق بسته و قیمت امروز لازم است.'}\n\nقدم بعدی: محصول را از بخش «بررسی» باز کن و مشخصات بسته جلوی دستت را تأیید کن.\nپوشش داده این تصمیم: ${fa(d.confidence)}٪؛ این عدد احتمال نتیجه‌گرفتن نیست.`}if(/بین|مقایسه|دو محصول/.test(n)){const list=DATA.catalog.slice().sort((a,b)=>(price(a)||Infinity)-(price(b)||Infinity)).slice(0,2);return list.length>1?`برای مقایسه واقعی فقط اسم دو محصول کافی نیست.\n\nاول این ۴ چیز را کنار هم می‌گذارم:\n• نقش هر محصول در روتین\n• نسخه و ترکیبات همان بسته\n• قیمت امروز\n• تجربه قبلی تو\n\nدو گزینه موجود برای شروع بررسی:\n۱. ${list[0].name}\n۲. ${list[1].name}\n\nقدم بعدی: نام دقیق همان دو محصولی که بینشان مرددی را در یک پیام بنویس.`:'برای مقایسه هنوز دو محصول قابل بررسی در دیتاست ندارم. نام دقیق یا لینک هر دو را بفرست تا وارد صف بررسی شوند.'}if(/کوتاه|سه قدم|صبح شلوغ|روتین/.test(n))return `جمع‌بندی: روتین قابل‌اجرا از روتین شلوغ بهتر است.\n\nنسخه پایه متناسب با زمان «${p.routineTime}»:\nصبح: مرطوب‌کننده در صورت نیاز + ضدآفتاب\nشب: شوینده ملایم + مرطوب‌کننده\n\nوضعیت کیف تو: ${nextNeed()}.\nقدم بعدی: تا مشخص‌شدن تحمل پوست، فقط یک تغییر تازه را شروع کن.`;if(/نتیجه|یاد گرفتی|قضاوت|امروز.*ثبت|پیگیری/.test(n)){const lp=latestPulse(),last=state.followups[state.followups.length-1];return `چیزی که واقعاً می‌دانم:\n• ${lp?`آخرین حال ثبت‌شده: ${lp.mood} (${lp.factor})`:'هنوز حال روزانه ثبت نشده'}\n• ${last?`آخرین نتیجه محصول: ${last.name}، رضایت ${fa(last.rating)} از ۵`:'هنوز نتیجه محصولی ثبت نشده'}\n\nچیزی که حدس نمی‌زنم: علت تغییر پوست بدون ثبت تغییرات هم‌زمان.\nقدم بعدی: ${state.wallet.length?'یک ثبت کوتاه انجام بده و امروز محصول تازه دیگری شروع نکن.':'اول محصول در حال مصرفت را به کیف اضافه کن.'}`}if(/بودجه|خرج|پول|اقتصادی|عقب بینداز/.test(n))return `تصویر مالی تو:\n• خرج ثبت‌شده این ماه: ${fa(spent())} تومان\n• بودجه باقی‌مانده: ${fa(remaining())} تومان\n• خریدهای متوقف یا معلق: ${fa(protectedMoney())} تومان\n\nقدم بعدی: قبل از پیشنهاد جایگزین ارزان، باید نقش محصول فعلی و قیمت امروز گزینه جدید را مقایسه کنم.`;if(/تکراری|کیف|دارم/.test(n))return `${state.wallet.length?`در کیفت ${fa(state.wallet.length)} محصول ثبت شده. ${nextNeed()}.`:'کیفت هنوز خالی است؛ بدون دیدن محصولات فعلی نمی‌خواهم درباره خرید تکراری حدس بزنم.'}\n\nقدم بعدی: نام سه محصولی را که بیشتر استفاده می‌کنی ثبت کن؛ لازم نیست کل روتینت را وارد کنی.`;return `برای اینکه جواب عمومی ندهم، فقط یک سؤال لازم دارم:\nاسم، لینک یا بارکد محصولی که الان جلوی توست چیست؟\n\nبعد آن را با پوست امروز (${p.skinToday})، هدف (${p.goal1})، بودجه و چیزهایی که داری مقایسه می‌کنم.`}
function daysSince(date){return Math.max(0,Math.floor((Date.now()-Date.parse(date))/864e5))}
function dueFollowups(){return state.wallet.filter(w=>daysSince(w.startedAt)>=2&&!state.followups.some(f=>f.walletId===w.id&&Date.now()-Date.parse(f.date)<7*864e5))}
function follow(){const due=dueFollowups(),lp=latestPulse();return shell(`<div class="page-head"><div><span class="eyebrow">اثر واقعی، نه حدس</span><h1>مسیر نتیجه من</h1><p>ثبت کوتاه، زمان‌بندی منطقی و فقط یک تغییر اصلی؛ بدون استریک اجباری و عذاب وجدان.</p></div><button class="gold" data-pulse>${lp?'ثبت دوباره حال امروز':'حال امروز را ثبت کن'}</button></div><div class="follow-grid"><section class="card follow-card due"><span class="day">۴۸ ساعت</span><span class="check">۱</span><h3>تحمل اولیه</h3><p class="muted">سوزش، قرمزی یا خشکی غیرعادی؟</p></section><section class="card follow-card"><span class="day">روز ۷</span><span class="check">۷</span><h3>تجربه مصرف</h3><p class="muted">بافت، پایبندی و حس پوست</p></section><section class="card follow-card"><span class="day">روز ۲۱</span><span class="check">۲۱</span><h3>نتیجه اولیه</h3><p class="muted">تغییر قابل‌مشاهده و ارزش خرید</p></section></div><section class="card" style="margin-top:16px"><h2>پیگیری‌های آماده</h2>${due.length?due.map(w=>`<div class="wallet-item"><span class="product-bottle">${esc(w.name.slice(0,2))}</span><div class="grow"><b>${esc(w.name)}</b><small>${esc(w.category)} · روز ${fa(daysSince(w.startedAt))} مصرف</small></div><button class="gold" data-follow-id="${w.id}">ثبت ۳۰ ثانیه‌ای</button></div>`).join(''):'<div class="empty">فعلاً پیگیری زمان‌داری نداری. تا رسیدن زمان مناسب، لازم نیست چیزی ثبت کنی.</div>'}</section><section class="card" style="margin-top:16px"><div class="page-head"><div><h2>ثبت‌های کوتاه حال پوست</h2><p class="small muted">برای جداکردن نتیجه محصول از خواب، استرس و تغییرات هم‌زمان.</p></div><button class="outline" data-pulse>ثبت جدید</button></div>${state.pulse.length?state.pulse.slice().reverse().slice(0,5).map(x=>`<div class="timeline-item"><b>${esc(x.mood)}</b><p>${esc(x.factor)}${x.note?' · '+esc(x.note):''}</p><small>${dateFa(x.date)}</small></div>`).join(''):'<p class="muted">هنوز ثبت کوتاهی نداری.</p>'}</section><div class="notice" style="margin-top:16px">این پیگیری برای حافظه تجربه مصرف است، نه تشخیص بیماری یا تغییر درمان تجویزی.</div>`)}
function profile(){
 const p=state.profile,cities=DATA.cities.map(x=>x.name),symptoms=['جوش فعال','خشکی','قرمزی','سوزش','خارش','پوسته‌ریزی'],sensory=['چسبندگی','برق پوست','سفیدک','پیل‌شدن','بوی زیاد'],safety=['بارداری یا شیردهی','درمان پزشکی پوست','داروی مؤثر بر پوست','بیماری پوستی تشخیص‌داده‌شده','لیزر/پیلینگ/میکرونیدلینگ اخیر','زخم یا عفونت فعال','واکنش شدید اخیر'];
 return shell(`<div class="page-head"><div><span class="eyebrow">یک‌بار ثبت کن؛ در همه تصمیم‌ها استفاده می‌شود</span><h1>پروفایل کامل من</h1><p>پوست، روتین، تجربه، سبک زندگی و بودجه را جدا می‌گیریم تا شخصی‌سازی قابل‌ردیابی باشد.</p></div></div><div class="profile-layout"><aside class="card profile-summary"><div class="big-avatar">${esc((p.name||'م').slice(0,1))}</div><h2>${esc(p.name||'پروفایل من')}</h2><div class="metric">${fa(profileScore())}٪</div><div class="progress"><i style="width:${profileScore()}%"></i></div><p class="muted small">کمبود اطلاعات تو و کمبود دیتای محصول در نتیجه جدا نمایش داده می‌شوند.</p><button class="outline full" data-demo>بارگذاری پروفایل آزمایشی</button></aside><form id="profileForm" class="side-stack">
 <details class="card" open><summary><b>پوست من</b><span>پایه و وضعیت امروز</span></summary><div class="form-grid details-body"><label class="field"><span>نام</span><input name="name" value="${esc(p.name)}" placeholder="مثلاً سارا"></label><label class="field"><span>نوع پایه پوست *</span><select name="skinBase" required>${opts(['چرب','خشک','مختلط','نرمال','مطمئن نیستم'],p.skinBase)}</select></label><label class="field"><span>وضعیت امروز *</span><select name="skinToday" required>${opts(['متعادل','چرب‌تر از معمول','خشک‌تر از معمول','تحریک‌شده','جوش فعال','قرمز و حساس'],p.skinToday)}</select></label><label class="field"><span>حساسیت امروز</span><select name="sensitivity">${opts(['کم','متوسط','زیاد'],p.sensitivity)}</select></label><label class="field"><span>حال لایه محافظ پوست</span><select name="barrier">${opts(['سالم','مشکوک','احتمالاً آسیب‌دیده','نمی‌دانم'],p.barrier)}</select></label><fieldset class="wide fieldset"><legend>علائم فعلی</legend><div class="check-grid">${symptoms.map(x=>`<label class="check-label"><input type="checkbox" name="symptoms" value="${x}" ${p.symptoms?.includes(x)?'checked':''}>${x}</label>`).join('')}</div></fieldset><label class="field wide"><span>آخرین تغییر مهم پوست</span><input name="lastSkinChange" value="${esc(p.lastSkinChange)}" placeholder="مثلاً پس از شروع رتینول، سفر یا تغییر هوا"></label></div></details>
 <details class="card" open><summary><b>هدف من</b><span>اولویت و خط قرمز</span></summary><div class="form-grid details-body"><label class="field"><span>هدف اول *</span><select name="goal1" required>${opts(['کاهش جوش التهابی','کاهش لک پس از جوش','آبرسانی و حمایت از لایه محافظ پوست','کاهش قرمزی','کنترل چربی','محافظت آفتاب','بهبود بافت','کاهش علائم پیری'],p.goal1)}</select></label><label class="field"><span>هدف دوم</span><select name="goal2">${opts(['','کاهش جوش التهابی','کاهش لک پس از جوش','آبرسانی و حمایت از لایه محافظ پوست','کاهش قرمزی','کنترل چربی','محافظت آفتاب','بهبود بافت'],p.goal2,x=>x||'فعلاً ندارم')}</select></label><label class="field"><span>بازه انتظار نتیجه</span><select name="expectationWindow">${opts(['نمی‌دانم','کمتر از ۲ هفته','۲ تا ۶ هفته','۶ تا ۱۲ هفته','بیشتر از ۱۲ هفته'],p.expectationWindow)}</select></label><label class="field"><span>عارضه غیرقابل‌قبول *</span><select name="dealbreaker" required>${opts(['خشکی و پوسته‌ریزی','جوش جدید','قرمزی و سوزش','چسبندگی','سفیدک','پیل‌شدن زیر آرایش','عطر زیاد'],p.dealbreaker)}</select></label></div></details>
 <details class="card" open><summary><b>روتین فعلی</b><span>نام، زمان، دفعات و تجربه</span></summary><div class="details-body"><div id="routineRows">${(p.routine||[]).map(routineRow).join('')}</div><button type="button" class="outline full" data-add-routine>＋ افزودن محصول روتین</button></div></details>
 <details class="card"><summary><b>تجربه‌های قبلی</b><span>نتیجه، واکنش و قطع مصرف</span></summary><div class="details-body"><div id="historyRows">${(p.history||[]).map(historyRow).join('')}</div><button type="button" class="outline full" data-add-history>＋ افزودن تجربه قبلی</button></div></details>
 <details class="card"><summary><b>ترجیحات محصول</b><span>بافت، عطر و تجربه حسی</span></summary><div class="form-grid details-body"><label class="field"><span>بافت ترجیحی</span><select name="texture">${opts(['فرقی ندارد','ژل سبک','لوسیون','کرم','بالم','سرم'],p.texture)}</select></label><label class="field"><span>عطر</span><select name="fragrance">${opts(['فرقی ندارد','بدون عطر','عطر ملایم قابل‌قبول'],p.fragrance)}</select></label><label class="field"><span>زیر آرایش</span><select name="makeupFit">${opts(['مهم نیست','حتماً سازگار باشد','روزانه آرایش می‌کنم'],p.makeupFit)}</select></label><label class="field"><span>مدت روتین</span><select name="routineTime">${opts(['حداکثر ۳ دقیقه','۳ تا ۷ دقیقه','روتین کامل برایم مناسب است'],p.routineTime)}</select></label><fieldset class="wide fieldset"><legend>تجربه حسی نامطلوب</legend><div class="check-grid">${sensory.map(x=>`<label class="check-label"><input type="checkbox" name="sensoryAvoid" value="${x}" ${p.sensoryAvoid?.includes(x)?'checked':''}>${x}</label>`).join('')}</div></fieldset></div></details>
 <details class="card"><summary><b>سبک زندگی و خرید</b><span>شهر، آفتاب، آرایش و بودجه</span></summary><div class="form-grid details-body"><label class="field"><span>شهر</span><select name="city">${opts(cities,p.city)}</select></label><label class="field"><span>مواجهه روزانه با آفتاب</span><select name="sun">${opts(['کم','متوسط','زیاد'],p.sun)}</select></label><label class="field"><span>آرایش</span><select name="makeup">${opts(['کم یا هیچ','چند روز در هفته','تقریباً روزانه'],p.makeup)}</select></label><label class="field"><span>ورزش و تعریق</span><select name="sweat">${opts(['کم','متوسط','زیاد'],p.sweat)}</select></label><label class="field"><span>بودجه ماهانه کل، تومان</span><input name="monthlyBudget" inputmode="numeric" value="${esc(p.monthlyBudget)}"></label><label class="field"><span>سقف قیمت هر محصول، تومان</span><input name="productBudget" inputmode="numeric" value="${esc(p.productBudget)}"></label><label class="field"><span>اولویت خرید</span><select name="purchasePriority">${opts(['نتیجه','اصالت','قیمت','تجربه مصرف','موجودی پایدار'],p.purchasePriority)}</select></label><label class="field"><span>ترجیح برند</span><select name="brandPreference">${opts(['فرقی ندارد','ایرانی','خارجی','داروخانه‌ای'],p.brandPreference)}</select></label><label class="field wide"><span>جایگزین اقتصادی</span><select name="economicAlternative">${opts(['بله، همیشه نشان بده','فقط اگر اختلاف قیمت زیاد است','خیر'],p.economicAlternative)}</select></label></div></details>
 <details class="card"><summary><b>سلامت، ایمنی و حریم خصوصی</b><span>پرچم‌های توقف و رضایت‌ها</span></summary><div class="details-body"><div class="check-grid">${safety.map(x=>`<label class="check-label"><input type="checkbox" name="safetyFlags" value="${x}" ${p.safetyFlags?.includes(x)?'checked':''}>${x}</label>`).join('')}</div><label class="field wide" style="margin-top:12px"><span>توضیح ضروری برای ایمنی</span><textarea name="safetyNote" rows="3">${esc(p.safetyNote)}</textarea></label><div class="consent-stack"><label class="check-label"><input type="checkbox" name="serviceConsent" ${p.serviceConsent?'checked':''} required>با ذخیره اطلاعات ضروری برای ارائه سرویس موافقم. *</label><label class="check-label"><input type="checkbox" name="photoConsent" ${p.photoConsent?'checked':''}>رضایت جداگانه برای ذخیره عکس (اختیاری)</label><label class="check-label"><input type="checkbox" name="researchConsent" ${p.researchConsent?'checked':''}>استفاده پژوهشی ناشناس (اختیاری و قابل لغو)</label></div></div></details>
 <button class="gold full">ذخیره پروفایل و به‌روزرسانی شخصی‌سازی</button></form></div>`)
}
function opts(arr,current,label=x=>x){return arr.map(x=>`<option value="${esc(x)}" ${String(x)===String(current)?'selected':''}>${esc(label(x))}</option>`).join('')}
function routineRow(x={name:'',category:'شوینده',time:'صبح',weekly:7,since:'',stage:'',adherence:'منظم',satisfaction:'هنوز نمی‌دانم'}){return `<div class="repeat-row routine-record"><label class="field"><span>نام و نسخه *</span><input name="routineName" value="${esc(x.name)}" placeholder="نام کامل محصول"></label><label class="field"><span>دسته</span><select name="routineCategory">${opts(CATEGORY_OPTIONS,x.category)}</select></label><label class="field"><span>زمان</span><select name="routineTimeOfDay">${opts(['صبح','شب','صبح و شب'],x.time)}</select></label><label class="field"><span>دفعات در هفته</span><input name="routineWeekly" type="number" min="1" max="14" value="${esc(x.weekly||7)}"></label><label class="field"><span>شروع مصرف</span><input name="routineSince" type="date" value="${esc(x.since)}"></label><label class="field"><span>مرحله</span><input name="routineStage" value="${esc(x.stage)}" placeholder="مثلاً بعد شوینده"></label><label class="field"><span>پایبندی</span><select name="routineAdherence">${opts(['منظم','گاهی فراموش می‌کنم','نامنظم'],x.adherence)}</select></label><label class="field"><span>رضایت</span><select name="routineSatisfaction">${opts(['راضی','فقط تحمل می‌کنم','ناراضی','هنوز نمی‌دانم'],x.satisfaction)}</select></label><button type="button" class="outline remove-record" data-remove-routine>حذف</button></div>`}
function historyRow(x={product:'',experience:'نتیجه مثبت',latency:'',certainty:'مطمئنم'}){return `<div class="repeat-row history-record"><label class="field"><span>محصول یا ترکیب *</span><input name="historyProduct" value="${esc(x.product)}" placeholder="نام محصول یا ماده مؤثره"></label><label class="field"><span>تجربه</span><select name="historyExperience">${opts(['نتیجه مثبت','بی‌نتیجه','جوش','سوزش/قرمزی','خرید مجدد','توقف'],x.experience)}</select></label><label class="field"><span>زمان بروز</span><input name="historyLatency" value="${esc(x.latency)}" placeholder="مثلاً روز سوم"></label><label class="field"><span>اطمینان</span><select name="historyCertainty">${opts(['مطمئنم','احتمال می‌دهم','نمی‌دانم'],x.certainty)}</select></label><button type="button" class="outline remove-record" data-remove-history>حذف</button></div>`}
function openModal(html){$('#modalBody').innerHTML=html;showDialog($('#modal'))}
function showDialog(d){if(typeof d.showModal==='function'){if(!d.open)d.showModal()}else{d.setAttribute('open','');d.classList.add('fallback-dialog');document.body.classList.add('dialog-visible')}const first=d.querySelector('input,select,textarea');if(first)setTimeout(()=>first.focus(),50)}
function closeModal(){const d=$('#modal');if(typeof d.close==='function')d.close();else d.removeAttribute('open');d.classList.remove('fallback-dialog');document.body.classList.remove('dialog-visible')}

function intakeDialog(){openModal(`<div class="dialog-title"><span class="eyebrow">ورودی محصول ناشناخته</span><h2>محصول را برای تکمیل ثبت کن</h2><p class="muted">یک عکس کافی است؛ بارکد به تنهایی فرمول را ثابت نمی‌کند.</p></div><form id="intakeForm" class="form-grid"><label class="field wide"><span>نام روی بسته *</span><input name="name" required></label><label class="field"><span>بارکد، اگر داری</span><input name="barcode" inputmode="numeric"></label><label class="field"><span>برند</span><input name="brand"></label><label class="field wide"><span>لینک محصول</span><input name="url" type="url"></label><label class="field wide"><span>متن ترکیبات روی بسته</span><textarea name="inci" rows="3"></textarea></label><button class="gold wide">ذخیره در کیف بررسی</button></form>`)}
function addWalletDialog(){openModal(`<div class="dialog-title"><span class="eyebrow">حافظه روتین</span><h2>محصول فعلی را اضافه کن</h2></div><form id="walletForm" class="form-grid"><label class="field wide"><span>نام محصول *</span><input name="name" required></label><label class="field"><span>دسته</span><select name="category">${opts(CATEGORY_OPTIONS,'شوینده')}</select></label><label class="field"><span>درصد باقی‌مانده</span><input name="remaining" type="number" min="0" max="100" value="100"></label><button class="gold wide">افزودن به کیف</button></form>`)}
function followDialog(id){const w=state.wallet.find(x=>x.id===id);if(!w)return;openModal(`<div class="dialog-title"><span class="eyebrow">پیگیری تجربه</span><h2>${esc(w.name)}</h2></div><form id="followForm" data-id="${esc(id)}"><label class="field"><span>رضایت کلی</span><div class="scale">${[1,2,3,4,5].map(n=>`<button type="button" data-rating="${n}" class="${n===3?'active':''}">${fa(n)}</button>`).join('')}</div><input type="hidden" name="rating" value="3"></label><div class="spacer"></div><label class="field"><span>حال پوست امروز</span><select name="skinState">${opts(['بهتر','بدون تغییر','خشک‌تر','جوش بیشتر','قرمزی یا سوزش'],'بدون تغییر')}</select></label><div class="spacer"></div><label class="field"><span>یادداشت کوتاه</span><textarea name="note" rows="3" placeholder="مثلاً بافت خوب بود اما روز سوم کمی سوزش داشتم"></textarea></label><div class="danger-note" style="margin-top:12px">اگر تورم، تاول، مشکل تنفس یا واکنش شدید داری، ثبت تجربه کافی نیست و باید کمک پزشکی بگیری.</div><button class="gold full" style="margin-top:12px">ثبت نتیجه</button></form>`)}
function walletV2(){const products=state.wallet.length?state.wallet.map(w=>`<div class="wallet-item"><span class="product-bottle">${esc((w.brand||w.name).slice(0,2))}</span><div class="grow"><b>${esc(w.name)}</b><small>${esc(w.category||'محصول مراقبتی')} · حدود ${fa(w.remaining)}٪ باقی‌مانده</small><div class="progress"><i style="width:${w.remaining}%"></i></div><div class="mini-actions"><button data-consume="${w.id}">۱۰٪ مصرف شد</button><button data-follow-id="${w.id}">ثبت نتیجه</button><button data-remove="${w.id}">حذف</button></div></div></div>`).join(''):'<div class="empty">برای شروع فقط سه محصول پراستفاده‌ات را اضافه کن؛ لازم نیست کل روتین را یکجا بنویسی.</div>';const experiments=state.experiments.length?state.experiments.slice().reverse().map(x=>`<div class="experiment-card"><b>${esc(x.productName)}</b><small>هدف: ${esc(x.goal)} · شروع ${dateFa(x.date)}</small><span class="tag good" style="margin-top:8px">یک تغییر فعال</span></div>`).join(''):'<div class="empty">هنوز آزمایش یک‌تغییر شروع نکرده‌ای.</div>';return shell(`<div class="page-head"><div><span class="eyebrow">حافظهٔ تصمیم و نتیجه تو</span><h1>کیف من</h1><p>فقط فهرست محصول نیست؛ نشان می‌دهد چه خریدی کردی، چه چیزی را متوقف کردی و واقعاً چه نتیجه‌ای گرفتی.</p></div><button class="gold" data-add-wallet>＋ افزودن محصول</button></div><div class="value-strip"><div class="value-card"><small>بودجه باقی‌مانده</small><strong>${fa(remaining())} تومان</strong><small>از ${fa(state.profile.monthlyBudget)} تومان</small></div><div class="value-card"><small>پول محافظت‌شده</small><strong>${fa(protectedMoney())} تومان</strong><small>خریدهای متوقف یا معلق</small></div><div class="value-card"><small>نتیجه واقعی</small><strong>${fa(state.followups.length)} ثبت</strong><small>برای تصمیم‌های بعدی</small></div></div><div class="wallet-grid"><section class="card"><h2>محصولات داخل کیف</h2>${products}</section><section class="card"><div class="page-head"><div><h2>آزمایش یک‌تغییر</h2><p class="small muted">هر بار یک تغییر تا علت نتیجه قابل‌فهم بماند.</p></div><button class="outline" data-experiment>شروع</button></div>${experiments}</section></div><div class="wallet-grid" style="margin-top:16px"><section class="card"><h2>تصمیم‌های ذخیره‌شده</h2>${state.reviews.length?state.reviews.slice().reverse().slice(0,10).map(x=>`<div class="timeline-item"><b>${esc(x.name)}</b><p>${esc(x.action)}${x.price?' · '+fa(x.price)+' تومان':''}</p><small>${dateFa(x.date)}</small></div>`).join(''):'<p class="muted">هنوز تصمیمی ثبت نشده است.</p>'}</section><section class="card"><h2>چیزی که از نتیجه‌ها یاد گرفتیم</h2>${state.followups.length?state.followups.slice().reverse().map(x=>`<div class="wallet-item"><span class="step-icon">${fa(x.rating)}</span><div><b>${esc(x.name)}</b><small>${bots(x.skinState)} · رضایت ${fa(x.rating)} از ۵</small><p>${esc(x.note||'بدون یادداشت')}</p></div></div>`).join(''):'<p class="muted">هنوز داده‌ای برای نتیجه‌گیری شخصی ثبت نشده است.</p>'}</section></div><section class="card" style="margin-top:16px"><h2>محصولات خارج از دیتاست</h2>${state.intakes.length?state.intakes.map(x=>`<div class="wallet-item"><span class="step-icon">؟</span><div><b>${esc(x.name)}</b><small>${esc(x.barcode||'بدون بارکد')} · در صف تکمیل پاسپورت</small></div></div>`).join(''):'<p class="muted">موردی در صف تکمیل نیست.</p>'}<button class="outline full" data-intake>ثبت محصول خارج از دیتاست</button></section>`)}
function bots(x){return esc(x||'وضعیت ثبت نشده')}
function render(){const views={home,review,assistant,wallet:walletV2,follow,profile};try{$('#app').innerHTML=(views[state.route]||home)()}catch(error){$('#app').innerHTML='<div class="card" style="margin:24px"><h1>این بخش باز نشد</h1><p>اطلاعاتت حذف نشده است. به خانه برگرد و دوباره امتحان کن.</p><button class="gold" data-route="home">بازگشت به خانه</button></div>';console.error('BeautyWallet render failed',error)};setTimeout(()=>{(()=>{const el=$('#chatBody');if(el)el.scrollTop=el.scrollHeight})()},0)}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.route)return routeTo(b.dataset.route);if(b.dataset.close!==undefined)return closeModal();
 if(b.dataset.quickCheck!==undefined)return quickCheckDialog();if(b.dataset.pulse!==undefined)return pulseDialog();if(b.dataset.experiment!==undefined)return experimentDialog();
 if(b.dataset.assistantMode){state.assistantMode=b.dataset.assistantMode;save();return render()}
 if(b.dataset.category!==undefined){state.filters.category=b.dataset.category;save();return render()}
 if(b.dataset.product)return productDialog(productById(b.dataset.product));
 if(b.dataset.fav){const id=b.dataset.fav;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();return render()}
 if(b.dataset.intake!==undefined)return intakeDialog();if(b.dataset.addWallet!==undefined)return addWalletDialog();if(b.dataset.followId)return followDialog(b.dataset.followId);
 if(b.dataset.consume){const w=state.wallet.find(x=>x.id===b.dataset.consume);w.remaining=Math.max(0,w.remaining-10);save();toast('میزان باقی‌مانده به‌روز شد.');return render()}
 if(b.dataset.remove){state.wallet=state.wallet.filter(x=>x.id!==b.dataset.remove);save();return render()}
 if(b.dataset.walletProduct){const p=productById(b.dataset.walletProduct);if(!state.wallet.some(x=>x.productId===p.productId))state.wallet.push({id:uid(),productId:p.productId,name:p.name,brand:p.brand,category:p.category,remaining:100,startedAt:new Date().toISOString()});save();closeModal();toast('به کیف اضافه شد.');return routeTo('wallet')}
 if(b.dataset.reviewAction){const p=productById(b.dataset.reviewAction),d=decision(p,{packageConfirmed:false});state.reviews.push({id:uid(),productId:p.productId,name:p.name,action:d.title,date:new Date().toISOString(),price:price(p)});save();closeModal();toast('تصمیم در کیف ثبت شد.');return}
 if(b.dataset.ask){ask(b.dataset.ask);return}
 if(b.dataset.rating){$$('[data-rating]',b.parentElement).forEach(x=>x.classList.toggle('active',x===b));b.parentElement.nextElementSibling.value=b.dataset.rating;return}
 if(b.dataset.addRoutine!==undefined){$('#routineRows').insertAdjacentHTML('beforeend',routineRow());return}
 if(b.dataset.removeRoutine!==undefined){b.closest('.routine-record').remove();return}
 if(b.dataset.addHistory!==undefined){$('#historyRows').insertAdjacentHTML('beforeend',historyRow());return}
 if(b.dataset.removeHistory!==undefined){b.closest('.history-record').remove();return}
 if(b.dataset.demo!==undefined){const d=DATA.demoProfile,cat=x=>x.includes('ضدآفتاب')?'ضدآفتاب':x.includes('شوینده')?'شوینده':x.includes('مرطوب')?'مرطوب‌کننده':'سرم و اکتیو';state.profile={...state.profile,...d,name:'سارا',monthlyBudget:2500000,productBudget:Number(d.productBudget||900000),routine:(d.routine||[]).map(x=>({...x,category:cat(x.name)})),history:d.history||[]};save();toast('پروفایل کامل آزمایشی بارگذاری شد.');return render()}
});
function ask(q){state.chat.push({role:'user',text:q},{role:'assistant',text:answer(q)});state.route='assistant';save();render()}
function collectRoutine(f){return $$('.routine-record',f).map(r=>({name:$('[name="routineName"]',r)?.value.trim(),category:$('[name="routineCategory"]',r)?.value,time:$('[name="routineTimeOfDay"]',r)?.value,weekly:Number($('[name="routineWeekly"]',r)?.value||0),since:$('[name="routineSince"]',r)?.value,stage:$('[name="routineStage"]',r)?.value.trim(),adherence:$('[name="routineAdherence"]',r)?.value,satisfaction:$('[name="routineSatisfaction"]',r)?.value})).filter(x=>x.name)}
function collectHistory(f){return $$('.history-record',f).map(r=>({product:$('[name="historyProduct"]',r)?.value.trim(),experience:$('[name="historyExperience"]',r)?.value,latency:$('[name="historyLatency"]',r)?.value.trim(),certainty:$('[name="historyCertainty"]',r)?.value})).filter(x=>x.product)}
document.addEventListener('invalid',e=>{let d=e.target.closest('details');while(d){d.open=true;d=d.parentElement.closest('details')}},true);
document.addEventListener('submit',e=>{const f=e.target;if(!['homeSearch','reviewSearch','chatForm','profileForm','intakeForm','walletForm','followForm','confirmPackage','quickCheckForm','pulseForm','experimentForm'].includes(f.id))return;e.preventDefault();const fd=new FormData(f),o=Object.fromEntries(fd);
 if(f.id==='homeSearch'||f.id==='reviewSearch'){state.filters.query=o.query||'';state.route='review';save();return render()}
 if(f.id==='chatForm'){if(o.message?.trim())ask(o.message.trim());return}
 if(f.id==='quickCheckForm'){state.profile={...state.profile,skinToday:o.skinToday,goal1:o.goal1,productBudget:Number(o.productBudget||state.profile.productBudget),quickStartedAt:new Date().toISOString()};state.filters.query=o.query.trim();state.route='review';save();closeModal();toast('سه داده لازم ثبت شد؛ حالا محصول را انتخاب کن.');return render()}
 if(f.id==='pulseForm'){const today=new Date().toISOString().slice(0,10),record={id:uid(),mood:o.mood,factor:o.factor,note:o.note||'',date:new Date().toISOString()};state.pulse=state.pulse.filter(x=>x.date.slice(0,10)!==today);state.pulse.push(record);save();closeModal();toast('حال امروز ثبت شد؛ ممنون که کوتاه و واقعی گفتی.');return routeTo('home')}
 if(f.id==='experimentForm'){const w=state.wallet.find(x=>x.id===o.walletId);if(!w)return;state.experiments.push({id:uid(),walletId:w.id,productName:w.name,goal:o.goal,date:new Date().toISOString(),status:'active'});save();closeModal();toast('دوره شروع شد؛ هر بار فقط همین تغییر را دنبال می‌کنیم.');return routeTo('follow')}
