# Deploys the test version (lite/) to Liara on every push to main.
# Needs: repository secret LIARA_API_TOKEN; optional repository variables LIARA_APP_NAME (default: beautywallet) and LIARA_PLATFORM (node or docker, default: node).
# AI keys (LIARA_API_KEY, ADMIN_TOKEN …) live only in the Liara app's environment variables, never here.
name: Deploy lite to Liara
on:
  push:
    branches: [main]
    paths: ['lite/**', '.github/workflows/liara.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check secret
        env: { T: '${{ secrets.LIARA_API_TOKEN }}' }
        run: test -n "$T" || { echo "::error::Add the LIARA_API_TOKEN repository secret first"; exit 1; }
      - name: Deploy
        working-directory: lite
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          APP: ${{ vars.LIARA_APP_NAME || 'beautywallet' }}
          PLATFORM: ${{ vars.LIARA_PLATFORM || 'node' }}
        run: |
          set -o pipefail
          if ! timeout 420 npx --yes @liara/cli@9.5.1 deploy --app "$APP" --api-token "$LIARA_TOKEN" --port 3000 --platform "$PLATFORM" --detach 2>&1 | tee out.txt; then
            msg=$(tail -c 900 out.txt | tr -d '\r' | tr '\n' ' ' | sed 's/[^[:print:]]//g'); echo "::error title=liara deploy::$msg"; exit 1
          fi
