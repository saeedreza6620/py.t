# Manual end-to-end check of the deployed test app (no secrets needed). Results show as annotations.
name: Check live app
on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product name to research (optional)'
        required: false
        default: ''
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        run: |
          h=$(curl -sS -m 30 https://beautywallet.liara.run/healthz 2>&1 | tr -d '\n' | cut -c1-600); echo "::notice title=healthz::$h"
          c=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" https://beautywallet.liara.run/config.json 2>&1); echo "::notice title=config.json::$c"
      - name: Research
        if: ${{ inputs.product != '' }}
        env: { P: '${{ inputs.product }}' }
        run: |
          body=$(jq -nc --arg n "$P" '{name:$n}')
          r=$(curl -sS -m 200 -X POST -H 'Content-Type: application/json' -d "$body" https://beautywallet.liara.run/api/research 2>&1 | jq -c '{found,verified,confidence,name_en,brand,category,n_inci:(.inci|length),inci:(.inci[:12]),variants,sources:[.sources[]?.url],model,error,tried}' 2>&1 | cut -c1-1500)
          echo "::notice title=research $P::$r"
