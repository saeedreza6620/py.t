# ONE-TIME: creates the Android signing key on GitHub, so nobody needs Java on their own computer.
# Before running: (1) make the repository PRIVATE, (2) add the secret ANDROID_KEYSTORE_PASSWORD (8+ characters,
# chosen by the owner, never shared in chat). The key is handed back ONLY as a 1-day private artifact; the owner
# downloads it, adds ANDROID_KEYSTORE_BASE64 as a secret, keeps two safe copies, and deletes the artifact.
# Refuses to run if the repo is public or if a key already exists (a second key would break store updates).
name: Android signing key (one time)
on: workflow_dispatch
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - name: Safety checks
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXISTING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "$IS_PRIVATE" != "true" ]; then echo "::error::Make the repository private first (Settings > General > Danger Zone > Change visibility)."; exit 1; fi
          if [ -n "$EXISTING" ]; then echo "::error::A signing key already exists (ANDROID_KEYSTORE_BASE64). Never make a second one: store updates would stop working."; exit 1; fi
          if [ ${#PW} -lt 8 ]; then echo "::error::Add the secret ANDROID_KEYSTORE_PASSWORD (at least 8 characters) first."; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the key
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          keytool -genkeypair -keystore out/beautywallet.keystore -storetype PKCS12 -alias beautywallet -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=BeautyWallet, O=BeautyWallet, C=IR"
          base64 -w0 out/beautywallet.keystore > out/ANDROID_KEYSTORE_BASE64.txt
          printf 'BeautyWallet signing key\nalias: beautywallet\npassword: the ANDROID_KEYSTORE_PASSWORD secret you chose (not stored here)\n\n1) Copy everything in ANDROID_KEYSTORE_BASE64.txt into a new secret named ANDROID_KEYSTORE_BASE64.\n2) Keep this zip in two safe places. If it is lost, the app can no longer be updated in Cafe Bazaar / Myket.\n3) Delete this artifact on GitHub.\n' > out/README.txt
          keytool -list -keystore out/beautywallet.keystore -storepass "$PW" | grep -i "fingerprint" || true
      - uses: actions/upload-artifact@v4
        with:
          name: beautywallet-signing-key
          path: out/
          retention-days: 1
