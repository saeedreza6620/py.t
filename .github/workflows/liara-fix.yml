# Manual repair of the Liara app's public address: reads the app state, turns the default *.liara.run subdomain
# back on and makes sure the app is running. Uses the repository secret LIARA_API_TOKEN (never printed).
name: Liara app repair
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.LIARA_API_TOKEN }}
      APP: ${{ vars.LIARA_APP_NAME || 'beautywallet' }}
      API: https://api.iran.liara.ir
    steps:
      - name: Repair
        run: |
          [ -n "$T" ] || { echo "::error title=token::LIARA_API_TOKEN is empty"; exit 1; }
          s=$(curl -sS -m 30 -H "Authorization: Bearer $T" "$API/v1/projects/$APP" | jq -c '.project|{name:.project_id,scale,status,defaultSubdomain,planID,isDeployed,frozen,network:(.network.name)}' 2>&1 | cut -c1-500)
          echo "::notice title=before::$s"
          r=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $T" -w " HTTP %{http_code}" "$API/v1/projects/$APP/default-subdomain/enable" 2>&1 | cut -c1-300)
          echo "::notice title=enable-subdomain::$r"
          sc=$(curl -sS -m 30 -H "Authorization: Bearer $T" "$API/v1/projects/$APP" | jq -r '.project.scale' 2>/dev/null)
          if [ "$sc" = "0" ]; then r2=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{"scale":1}' -w " HTTP %{http_code}" "$API/v1/projects/$APP/actions/scale" 2>&1 | cut -c1-300); echo "::notice title=start-app::$r2"; fi
          sleep 25
          a=$(curl -sS -m 30 -H "Authorization: Bearer $T" "$API/v1/projects/$APP" | jq -c '.project|{scale,status,defaultSubdomain}' 2>&1 | cut -c1-300)
          echo "::notice title=after::$a"
          h=$(curl -sS -m 30 https://$APP.liara.run/healthz 2>&1 | tr -d '\n' | cut -c1-300); echo "::notice title=healthz::$h"
