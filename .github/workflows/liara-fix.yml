# Manual check/repair of the Liara app's public address: shows app state and domains, and asks Liara to turn the
# default *.liara.run subdomain back on (Liara refuses once it has expired). Uses the repository secret LIARA_API_TOKEN (never printed).
name: Liara app repair
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.LIARA_API_TOKEN }}
      APP: ${{ vars.LIARA_APP_NAME || 'beautywallet' }}
      API: https://api.iran.liara.ir
    steps:
      - name: Repair
        run: |
          [ -n "$T" ] || { echo "::error title=token::LIARA_API_TOKEN is empty"; exit 1; }
          H="Authorization: Bearer $T"
          s=$(curl -sS -m 30 -H "$H" "$API/v1/projects/$APP" | jq -c '.project|{scale,status,defaultSubdomain,defaultSubdomainExpired,keepDefaultSubdomain,created_at,planID,network:(.network.name)}' 2>&1 | cut -c1-900)
          echo "::notice title=app::$s"
          d=$(curl -sS -m 30 -H "$H" "$API/v1/domains?project=$APP" | jq -c '[.domains[]?|{name,status,certificatesStatus,type}]' 2>&1 | cut -c1-500)
          echo "::notice title=domains::$d"
          ID=$(curl -sS -m 30 -H "$H" "$API/v1/projects/$APP" | jq -r '.project._id')
          r=$(curl -sS -m 30 -X POST -H "$H" -w " HTTP %{http_code}" "$API/v1/projects/$ID/default-subdomain/enable" 2>&1 | tr -d '\n' | cut -c1-200); echo "::notice title=enable default subdomain::$r"
          for u in https://$APP.liara.run/healthz; do c=$(curl -sS -m 20 -o /tmp/b -w "%{http_code}" $u 2>&1); e=$(grep -o 'error-pages[^"]*' /tmp/b | head -1); echo "::notice title=$u::$c $e"; done
          a=$(curl -sS -m 30 -H "$H" "$API/v1/projects/$APP" | jq -c '.project|{scale,status,defaultSubdomain}' 2>&1 | cut -c1-300)
          echo "::notice title=after::$a"
