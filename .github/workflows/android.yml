# Builds the BeautyWallet Android app (android-app/, Capacitor) and attaches the APK to the run.
# Signed release APK when the 4 signing secrets exist (see docs/ANDROID.md); otherwise a debug APK for testing.
# The keystore lives ONLY in GitHub secrets — never in the repo.
name: Android APK
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # the old default 'tools' package no longer exists
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Create the Android project (icons, permissions, version, signing hooks)
        run: npm run prepare-android
      - name: Keystore from secrets (if set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/bw.keystore"; echo "BW_KEYSTORE=$RUNNER_TEMP/bw.keystore" >> "$GITHUB_ENV"; echo "signed release build"; else echo "no keystore secret: debug build"; fi
      - name: Build APK
        env:
          BW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android && chmod +x gradlew
          if [ -n "$BW_KEYSTORE" ]; then ./gradlew --no-daemon assembleRelease; cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/BeautyWallet-${GITHUB_RUN_NUMBER}.apk"
          else ./gradlew --no-daemon assembleDebug; cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/BeautyWallet-${GITHUB_RUN_NUMBER}-debug.apk"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: BeautyWallet-apk-${{ github.run_number }}
          path: BeautyWallet-*.apk
          retention-days: 30
