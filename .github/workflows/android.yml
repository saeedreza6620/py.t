# Builds the BeautyWallet Android app (android-app/, Capacitor) and attaches the APK to the run.
# Signed release APK when the 4 signing secrets exist (see docs/ANDROID.md); otherwise a debug APK for testing.
# The keystore lives ONLY in GitHub secrets — never in the repo.
name: Android APK
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Put the SIGNED APK on the site (/download/beautywallet.apk) and redeploy. Debug builds are never published.'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # the old default 'tools' package no longer exists
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Create the Android project (icons, permissions, version, signing hooks)
        run: npm run prepare-android
      - name: Keystore from secrets (if set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/bw.keystore"; echo "BW_KEYSTORE=$RUNNER_TEMP/bw.keystore" >> "$GITHUB_ENV"; echo "signed release build"; else echo "no keystore secret: debug build"; fi
      - name: Build APK
        env:
          BW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android && chmod +x gradlew
          if [ -n "$BW_KEYSTORE" ]; then ./gradlew --no-daemon assembleRelease; cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/BeautyWallet-${GITHUB_RUN_NUMBER}.apk"
          else ./gradlew --no-daemon assembleDebug; cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/BeautyWallet-${GITHUB_RUN_NUMBER}-debug.apk"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: BeautyWallet-apk-${{ github.run_number }}
          path: BeautyWallet-*.apk
          retention-days: 30
      - name: Publish signed APK to the site
        if: ${{ inputs.publish == true }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls BeautyWallet-*.apk | grep -v -- '-debug' | head -1 || true)
          if [ -z "$f" ]; then echo "::error title=publish::No signed APK (signing secrets missing). Debug builds are never published."; exit 1; fi
          mkdir -p lite/public/download && cp "$f" lite/public/download/beautywallet.apk
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lite/public/download/beautywallet.apk
          git commit -m "apk: publish $f to /download/beautywallet.apk" || { echo "same APK already published"; exit 0; }
          git pull --rebase -q origin main && git push -q origin HEAD:main
          gh workflow run liara.yml --ref main
          echo "::notice title=publish::$f is on its way to https://beautywallet.liara.run/download/beautywallet.apk (Liara deploy started)"
