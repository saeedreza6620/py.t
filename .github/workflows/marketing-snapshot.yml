# Every Friday night (Tehran) — after the team types the week's Instagram numbers in /admin/marketing — fetch the
# weekly marketing snapshot (aggregates only: no names, phones or device ids) and commit it to data/marketing/.
# A Claude session then builds the next content pack from it (.claude/skills/beautywallet-weekly/SKILL.md).
# Needs the repository secret ADMIN_TOKEN (same value as in Liara). The token goes in a header, never in a URL.
name: Marketing snapshot (weekly)
on:
  schedule:
    - cron: '17 20 * * 5'   # Friday 20:17 UTC = Friday ~23:47 Tehran
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch snapshot
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SITE: https://beautywallet.liara.run
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then echo "::error::Add the repository secret ADMIN_TOKEN (same value as in Liara)."; exit 1; fi
          mkdir -p data/marketing
          curl -fsS --max-time 60 -H "X-Admin-Token: $ADMIN_TOKEN" "$SITE/admin/marketing.json?weeks=12" -o /tmp/snap.json
          python3 - <<'PY'
          import json,re,sys
          raw=open('/tmp/snap.json',encoding='utf-8').read(); d=json.loads(raw)
          assert 'weeks' in d and 'totals' in d, 'unexpected snapshot shape'
          if re.search(r'(?<!\d)(?:\+98|0)?9\d{9}(?!\d)', raw): sys.exit('refusing: something that looks like a phone number is in the snapshot')
          PY
          D=$(TZ=Asia/Tehran date +%F)
          cp /tmp/snap.json "data/marketing/snapshot-$D.json"; cp /tmp/snap.json data/marketing/latest.json
      - name: Commit
        run: |
          git config user.name "beautywallet-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/marketing
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: weekly marketing snapshot $(TZ=Asia/Tehran date +%F)"
          git push
